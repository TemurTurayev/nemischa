[project]
name = "nemischa-pipeline"
version = "0.1.0"
description = "Builds the open German–Uzbek vocabulary dataset from raw word lists"
# lxml 4.9 (needed by german-nouns) ships no wheels for Python 3.13+.
requires-python = ">=3.11,<3.13"
dependencies = ["german-nouns", "genanki"]

[project.scripts]
nemischa-build = "nemischa.build:main"
nemischa-anki = "nemischa.anki:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemischa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nemischa --cov-report=term-missing"
